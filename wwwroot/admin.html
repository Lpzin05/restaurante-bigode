<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante do Bigode - Admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">Restaurante do Bigode - Área Admin</div>
    <a class="header-link" href="cliente.html">Pedido online</a>
  </header>
  <main class="auth-page">
    <section class="login-card">
      <h1>Acesso do administrador</h1>
      <p>Somente pessoas da empresa podem acessar o painel e alterar o cardápio.</p>
      <label for="usuario">Usuário</label>
      <input id="usuario" placeholder="Digite o usuário">
      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Digite a senha">
      <button id="entrar" class="primary-button" type="button">Entrar</button>
      <p id="mensagemLogin" class="small-text"></p>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
